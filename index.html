<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>课程学习室</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#lesson-content">跳到学习内容</a>
  <header class="topbar">
    <button class="brand" id="home-button" aria-label="返回课程总览"><span class="brand-symbol" aria-hidden="true">Aa<span>↗</span></span><span>我的学习室<small>把知识，留在身边。</small></span></button>
    <div class="top-actions" style="gap:12px"><a class="text-button" style="white-space:nowrap;text-decoration:none" href="books.html">绘本书架</a><span class="local-label"><i></i>本地课程库</span><button class="button subtle mobile-menu" id="menu-button" style="white-space:nowrap" aria-expanded="false" aria-controls="sidebar">课程目录</button></div>
  </header>
  <div class="workspace">
    <aside class="sidebar" id="sidebar" aria-label="课程目录">
      <div class="sidebar-heading"><span class="small-label">课程目录</span><button id="overview-button" class="text-button">查看总览 ↗</button></div>
      <h1 id="course-title">课程学习室</h1>
      <div class="progress-top"><span>我的学习进度</span><strong id="progress-label">0 / 0</strong></div>
      <progress id="progress" max="1" value="0" aria-label="课程完成进度"></progress>
      <label class="search-box"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m16 16 4.5 4.5"></path></svg><input id="search" type="search" placeholder="搜索课程名称…" aria-label="搜索课程名称"></label>
      <div class="filters"><label><span class="sr-only">内容类型</span><select id="type-filter"><option value="all">全部类型</option><option value="video">视频</option><option value="audio">音频</option><option value="text">图文</option></select></label><label><span class="sr-only">学习状态</span><select id="status-filter"><option value="all">全部课程</option><option value="available">可离线学习</option><option value="partial">部分保存</option><option value="unfinished">未学完</option><option value="done">已学完</option><option value="pending">待下载</option></select></label></div>
      <div class="list-caption" id="list-caption"></div>
      <nav class="lesson-list" id="lesson-list" aria-label="选择课程"></nav>
      <div class="sidebar-bottom"><p>学习进度和笔记保存在当前浏览器。<br>导出笔记，可为学习记录留一份备份。</p><button id="export-notes" class="text-button">导出全部笔记 ↓</button></div>
    </aside>
    <main id="lesson-content" tabindex="-1"><div id="content"></div></main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="course-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
