<!--全局回到首页悬浮按钮控制-->
<style>
    #app-layout {
        position: relative;
        margin: 0 auto;
        max-width: 480px;
        min-height: 100vh;
        background: #f5f5f5;
    }
    .last-page {
        display: none;
        position: fixed;
        top: 20px;
        left: calc(50% - 240px - 174px);
        width: 154px;
        height: 40px;
        line-height: 40px;
        font-size: 16px;
        color: #333;
        text-align: center;
        border-radius: 24px;
        background: #fff;
        cursor: pointer;
    }
    .navigation_home_menu {
        margin: 0;
        font-size: 0.24rem; /*防止vue加载css时字体过大*/
    }
    .navigation_menu {
        display: none;
        position: fixed;
        bottom: 1.89rem;
        right: 0;
        height: 0.6rem;
        width: 1.58rem;
        background-color: #353535;
        opacity: 0.3;
        z-index: 1000;
        border-radius: 0.5rem 0 0 0.5rem;
        overflow: hidden;
    }

    @media (min-width: 480px) {
        .navigation_menu {
            right: calc(50% - 240px);
        }
    }

    ::-webkit-scrollbar {
        width: 0.08rem;
        height: 0.08rem;
        border-radius: 0.08rem;
    }

    ::-webkit-scrollbar-thumb {
        width: 0.08rem;
        height: 0.08rem;
        border-radius: 0.08rem;
        background: #999;
    }
    .navi_control {
        position: absolute;
        right: 0;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        z-index: 2;
        text-decoration: none;
        color: #fff;
    }
    .navi_home {
        width: 0.24rem;
        height: 0.24rem;
        position: absolute;
        left: 0.2rem;
        top: 50%;
        margin-left: 0;
        margin-top: -0.12rem;
        background: url('/images/navi/homeButtonIcon.png') center center;
        background-repeat: no-repeat;
        background-size: 100%;
    }
    .navi_home_txt {
        text-align: right;
        padding-right: 0.1rem;
        line-height: 0.6rem;
        font-size: 0.24rem;
    }
</style>

<div id="app-layout">
    
    <div class="last-page">
        <i class="iconfont icon-previewleft last-page-arrow"></i>
        <span>返回前一页</span>
    </div>
    
    <!--真实的页面挂载点1-->
    <div id="common_template_mounted_el_container"><div id="app"></div></div>
</div>
